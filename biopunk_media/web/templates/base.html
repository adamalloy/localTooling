<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biopunk Media{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <svg class="bg-texture" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <pattern id="tex" width="230" height="230" patternUnits="userSpaceOnUse">
        <rect x="18" y="30" width="4" height="22" rx="1" fill="#3fd47a" opacity="0.14"/>
        <rect x="24" y="38" width="4" height="12" rx="1" fill="#3fd47a" opacity="0.10"/>
        <rect x="60" y="10" width="4" height="30" rx="1" fill="#3fd47a" opacity="0.13"/>
        <rect x="66" y="18" width="4" height="16" rx="1" fill="#3fd47a" opacity="0.09"/>
        <rect x="110" y="60" width="4" height="18" rx="1" fill="#3fd47a" opacity="0.11"/>
        <rect x="140" y="20" width="4" height="26" rx="1" fill="#3fd47a" opacity="0.13"/>
        <rect x="180" y="70" width="4" height="20" rx="1" fill="#3fd47a" opacity="0.10"/>
        <rect x="8" y="120" width="4" height="16" rx="1" fill="#3fd47a" opacity="0.09"/>
        <rect x="45" y="140" width="4" height="24" rx="1" fill="#3fd47a" opacity="0.12"/>
        <rect x="95" y="110" width="4" height="28" rx="1" fill="#3fd47a" opacity="0.13"/>
        <rect x="150" y="150" width="4" height="18" rx="1" fill="#3fd47a" opacity="0.10"/>
        <rect x="200" y="130" width="4" height="22" rx="1" fill="#3fd47a" opacity="0.11"/>
        <rect x="30" y="190" width="4" height="20" rx="1" fill="#3fd47a" opacity="0.10"/>
        <rect x="170" y="195" width="4" height="24" rx="1" fill="#3fd47a" opacity="0.12"/>
        <g opacity="0.06" stroke="#3fd47a" stroke-width="1.4">
          <path d="M85 55 h8 M89 51 v8"/>
          <path d="M162 95 h7 M165.5 91.5 v7"/>
          <path d="M55 175 h7 M58.5 171.5 v7"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#tex)"/>
  </svg>
  <header class="topbar">
    <a class="brand" href="/calendar">BIOPUNK <span>MEDIA</span></a>
    <nav>
      <a href="/calendar">Calendar</a>
      <a href="/content">Backlog</a>
      <a href="/media">Media</a>
      <a href="/ideas">Ideas</a>
      <a href="/houses">Houses</a>
      <a href="/companies">Companies</a>
      <a href="/members">Members</a>
      <a class="cta" href="/content/new">+ New content</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
